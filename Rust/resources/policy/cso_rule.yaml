# ============================================================================
# cso_rule.yaml — C/S/O 자동 분류 규칙셋 (L1 정규식 + L2 기밀사전)
# ----------------------------------------------------------------------------
# 등급 우선순위: C(기밀) > S(민감) > O(공개)
#
# [등급 산정 방식]
#   - 각 규칙은 base_grade 를 가진다 (히트 1건이라도 있으면 이 등급).
#   - bulk_threshold 이상 검출되면 bulk_grade 로 "상향"된다.
#       예) 주민번호 1건=S, 5건 이상=C (명단/대장 정황).
#   - 여러 규칙이 걸리면 최종은 max(등급)  → 보수적(높은 등급 우선).
#
# [seed_eligible]
#   - true  : 오탐이 적어, 이 히트로 확정된 문서를 임베딩 전파(Signal B)의
#             "씨앗(seed)"으로 승격해도 안전하다.
#   - false : 오탐 가능성이 있어 등급 참고용으로만 쓰고 seed 로는 쓰지 않는다.
#
# [프라이버시 불변식]
#   - 스캐너는 매칭된 "원문 값"을 절대 저장하지 않는다.
#   - 결과에는 {규칙 id, 종류, 건수}만 남긴다. (예: rrn 12건 검출)
#
# [context_within]
#   - 지정 시, 패턴이 라벨 키워드 근처(N자 이내)에 있을 때만 히트로 인정.
#   - 오탐이 심한 패턴(계좌/여권/면허)의 정밀도를 끌어올린다.
#
# ※ "# TODO(사내)" 로 표시된 항목은 조직 특화라 운영자가 채워야 한다.
# ============================================================================

# 2026-09-14 cso-2026.09.1: 보안등급 평가셋(500건) 기반 조정 — C 과대등급 축소·사내 규정 C 보강.
#   제품명 C→O · 국적 bulk C→S · 사내 핵심 규정/라이선스 증서/계정·접속정보(파일명) C 추가 ·
#   기술비밀·기밀 표식·스탬프 과매칭 어휘 정리 · '기밀성' 제외 · 민감정보 min_count 3.
#   (stamps exclude · sensitive min_count 는 이 버전부터 두 엔진이 읽는다 — 이전 엔진은 무시)
# 2026-09-14 cso-2026.09.2: keywords 단어별 최소 횟수(term_min_count) 추가 — 인사·급여 '징계' 3회 이상.
#   (term_min_count 는 이 버전부터 두 엔진이 읽는다 — 이전 엔진은 무시하고 종전처럼 1회로 센다)
version: "cso-2026.09.2"

defaults:
  bulk_threshold: 5          # 별도 지정 없으면 5건 이상에서 bulk 상향
  case_insensitive: true     # 영문 키워드 대소문자 무시
  # 검토함 편입선(2026-09-21) — 확신이 이 값보다 낮은 판정은 사람이 한 번 본다.
  #   · 등급(C/S/O)은 이 값과 무관하다. '사람이 볼까 말까'만 가른다
  #   · 올리면 검토할 문서가 늘고, 내리면 준다
  #   · 화면(설정 ② 판단 기준 › 보안등급)에서 고칠 수 있다
  #   · 이 칸이 없으면 0.6 으로 본다(종전 값 — 화면 코드에 박혀 있던 것을 옮겼다)
  review_threshold: 0.6
  # 개인정보(PII)만으로 올릴 수 있는 최고 등급(2026-09-21) — C · S · O 중 하나.
  #   · 주민번호 대량·신원+금융 결합처럼 PII(regex_pii · pii_combos) 근거만으로 C 가 되는 것을 막는다
  #   · 키워드·민감정보·스탬프·파일명이 낸 C 는 그대로다 — 막는 것은 'PII 하나로만' C
  #   · 깎인 히트에는 원래 등급이 capped_from 으로 남는다
  #   · 칸이 없으면 제한 없음(종전 동작). 화면(설정 ② 판단 기준 › 보안등급)에서도 고칠 수 있다
  # pii_grade_cap: S

# ────────────────────────────────────────────────────────────────────────
# 신뢰도(weight → conf) 표
#   - 각 신호의 weight(high/medium/low)를 0~1 신뢰도로 바꾸는 표.
#   - 신뢰도는 "검토 큐" 편입/정렬에만 쓰인다(신뢰도 < 저신뢰기준이면 사람 검토).
#     C/S/O 등급 자체는 바꾸지 않는다.
#   - 이 값은 UI에서 표기만 하고, 수정은 이 파일을 직접 편집한다.
# ────────────────────────────────────────────────────────────────────────
confidence:
  regex:     {high: 0.90, medium: 0.70, low: 0.50}   # 정규식 PII(형식탐지)
  keyword:   {high: 0.85, medium: 0.70, low: 0.50}   # 기밀사전
  sensitive: {high: 0.85, medium: 0.70, low: 0.55}   # 법상 민감정보군
  stamp:     {high: 0.95, medium: 0.80, low: 0.65}   # 보안분류 스탬프(오탐 낮아 높게)
  name:      0.60                                      # 파일명(힌트라 고정)

# ────────────────────────────────────────────────────────────────────────
# 2차 분류 · 임베딩 전파(Signal B) 임계값 (2026-11-04)
#   - 1차 규칙으로 등급이 안 나온 문서를, 벡터가 비슷한 기준문서(seed)의 등급으로 구제한다.
#   - 업무분류의 doc_rule.yaml embed: 와 같은 모양이지만 값은 따로 쓴다
#     (보안등급은 C/S/O 중 하나만 고르고, 업무분류는 여러 개를 고른다).
#   - 아래 값은 엔진 기본값 그대로다. 칸을 지워도 같은 값으로 동작한다.
#     업무분류는 실측(2026-08-26)으로 min_sim 을 0.55 → 0.70 으로 올렸지만,
#     보안등급은 아직 실측 재보정 전이다.
#   - 이 칸은 이 버전부터 두 엔진(Python·Rust)이 읽는다 — 이전 엔진은 무시하고 기본값을 쓴다.
# ────────────────────────────────────────────────────────────────────────
embed:
  k: 10                 # 참고할 최근접 기준문서 수(투표인단)
  dup_threshold: 0.95   # 1등 유사도 ≥ 이 값 → 사본으로 보고 그 등급 그대로 상속
  min_sim: 0.55         # 1등 유사도 < 이 값 → 너무 멀어 보류
  min_share: 0.70       # 1등 등급 득표율 < 이 값 → 이웃 의견이 갈려 보류

# ────────────────────────────────────────────────────────────────────────
# L1 · PII (개인식별정보) — 검출은 ko-pii, 여기선 "유형→등급 정책"만 정의
#   [A안, 2026-08] 자체 정규식+stdnum → ko-pii(Marker-Inc-Korea, MIT) 전면 교체.
#   pattern/validate/context 는 더 이상 안 쓴다(ko-pii 가 체크섬·문맥·회피방어 내장).
#   각 항목은 label(ko-pii 라벨)로 매핑하고, base_grade/bulk_grade/weight/seed 만 정한다.
# ────────────────────────────────────────────────────────────────────────
regex_pii:

- id: rrn
  name: 주민등록번호
  label: RRN
  base_grade: S
  bulk_grade: C
  weight: high
  seed_eligible: true

- id: foreign_reg
  name: 외국인등록번호
  label: FRN
  base_grade: S
  bulk_grade: C
  weight: high
  seed_eligible: true

- id: credit_card
  name: 신용카드번호
  label: CARD
  base_grade: S
  bulk_grade: C
  weight: high
  seed_eligible: true

- id: bank_account
  name: 계좌번호
  label: ACCOUNT       # ko-pii 가 계좌 문맥/형식을 내장 검증(과거 context_within 불필요)
  base_grade: S
  bulk_grade: C
  weight: medium
  seed_eligible: false

- id: passport
  name: 여권번호
  label: PASSPORT
  base_grade: S
  bulk_grade: C
  weight: medium
  seed_eligible: false

- id: driver_license
  name: 운전면허번호
  label: DRIVER_LICENSE
  base_grade: S
  bulk_grade: C
  weight: medium
  seed_eligible: false

- id: phone_mobile
  name: 휴대전화번호
  label: PHONE
  base_grade: O                            # 연락처는 흔함 → 단독으론 공개
  bulk_grade: S                            # 대량이면 명단 정황 → 민감
  weight: low
  seed_eligible: false

- id: email
  name: 이메일주소
  label: EMAIL
  base_grade: O
  bulk_grade: S
  weight: low
  seed_eligible: false

- id: biz_reg_no
  name: 사업자등록번호
  label: BUSINESS_REG   # ko-pii = 국세청 가중합 체크섬(진짜 검증) → stdnum brn 한계 해소
  base_grade: O                            # 반공개 정보
  bulk_grade: S
  weight: low
  seed_eligible: false

- id: corp_reg_no
  name: 법인등록번호
  label: CORP_REG       # ko-pii = 법인 체크섬 검증
  base_grade: O
  bulk_grade: S
  weight: low
  seed_eligible: false

# ── 권장 민감세트(2026-08 추가) — 저오탐·실질 민감 유형 ──────────────
- id: address
  name: 주소
  label: ADDRESS
  base_grade: S
  bulk_grade: C
  weight: medium
  seed_eligible: false

- id: medical_insurance
  name: 건강보험번호
  label: MEDICAL_INSURANCE   # 건강정보 = 민감정보(PIPA)
  base_grade: C
  bulk_grade: C
  weight: high
  seed_eligible: false

- id: prescription
  name: 처방전
  label: PRESCRIPTION_ID   # ko-pii 검출기가 내보내는 실제 라벨(과거 'PRESCRIPTION' 오타로 미검출)
  base_grade: C
  bulk_grade: C
  weight: medium
  seed_eligible: false

- id: edi_drug
  name: 의약품(EDI)
  label: EDI_DRUG
  base_grade: S
  bulk_grade: C
  weight: low
  seed_eligible: false

- id: vehicle
  name: 차량번호
  label: VEHICLE
  base_grade: S
  bulk_grade: C
  weight: low
  seed_eligible: false

- id: court_case
  name: 사건번호
  label: COURT_CASE
  base_grade: S
  bulk_grade: C
  weight: low
  seed_eligible: false

- id: pnu
  name: 부동산고유번호
  label: PNU
  base_grade: S
  bulk_grade: C
  weight: low
  seed_eligible: false

- id: nationality
  name: 국적
  label: NATIONALITY
  base_grade: S
  bulk_grade: S                            # 2026-09-14 C→S: 보고서·뉴스의 국가명 반복이 C 오탐 44건을 냄(평가셋)
  weight: low
  seed_eligible: false

# URL·IP: 네트워크 식별자. 단독으론 민감도 낮아 base_grade O(공개), 대량이면 S 로 상향
# (접속로그/네트워크 구성 유출 정황). 운영 중 등급/임계값 조정 가능.
- id: url
  name: URL
  label: URL
  base_grade: O
  bulk_grade: S
  weight: low
  seed_eligible: false

- id: ip_address
  name: IP주소
  label: IP
  base_grade: O
  bulk_grade: S
  weight: low
  seed_eligible: false

# ────────────────────────────────────────────────────────────────────────
# L1-combo · PII 결합식별성 (개인정보보호법/GDPR '결합용이성')
#   - 개별 PII 는 등급이 낮아도(예: 전화·이메일 O), 여러 유형이 '한 문서에' 모이면
#     특정 개인을 재식별하기 쉬워진다 → 상향 등급을 준다.
#   - 판정은 '문서 단위 공존'만 본다(문장 근접성 아님). 위 regex_pii 로 검출된 라벨의
#     건수(>0)를 조합 조건과 대조한다.
#   - 조건 형식(둘 중 하나 또는 둘 다=AND):
#       · all_of: [L1, L2 ...]        → 나열 라벨이 '모두' 있으면 성립
#       · of: [..], min_types: N      → of 그룹에서 '서로 다른' 라벨 N종 이상이면 성립
#   - 최종 등급은 다른 신호·개별 PII 와 max 융합되어 '상향 전용'으로만 작용한다.
#   ※ 결과 근거(terms)에는 결합된 'ko-pii 라벨+건수'만 남는다(원문 PII 값 아님).
# ────────────────────────────────────────────────────────────────────────
pii_combos:

- id: identity_financial
  name: 신원+금융 결합(재식별·금융피해)
  all_of: [RRN, ACCOUNT]        # 주민번호 + 계좌 → 금융 재식별 위험
  grade: C
  weight: high
  seed_eligible: true

- id: identity_card
  name: 신원+카드 결합
  all_of: [RRN, CARD]           # 주민번호 + 신용카드
  grade: C
  weight: high
  seed_eligible: true

- id: identity_address
  name: 신원+주소 결합(거주지 특정)
  all_of: [RRN, ADDRESS]        # 주민번호 + 주소 → 완전한 신원 특정
  grade: C
  weight: high
  seed_eligible: true

- id: foreign_financial
  name: 외국인신원+금융 결합
  all_of: [FRN, ACCOUNT]        # 외국인등록번호 + 계좌
  grade: C
  weight: high
  seed_eligible: true

- id: contact_cluster
  name: 연락처 결합(개인 특정)
  of: [PHONE, EMAIL, ADDRESS]   # 개별론 O 이지만…
  min_types: 2                  # …2종 이상 모이면 개인 특정 가능 → S
  grade: S
  weight: medium
  seed_eligible: false

# ────────────────────────────────────────────────────────────────────────
# L2 · 기밀사전 (키워드/표식)
#   terms 안의 단어가 하나라도 텍스트에 있으면 히트.
# ────────────────────────────────────────────────────────────────────────
keywords:

- id: mark_confidential
  name: 기밀 표식
    # "비밀"(바른 단어)은 비밀번호/영업비밀/비밀유지 등에 과매칭돼 제외.
    #   (영업비밀=tech_secret, 비밀유지=legal_contract 에서 구체형으로 커버)
    # 2026-09-14 본문 영문 CONFIDENTIAL·RESTRICTED·SECRET 제외: 평가셋에서 정답 C 는 0건,
    #   C 오탐 8건이 이것만으로 C 가 됐다(SCPI 명령 설명서·OpenSSL 규격·"secret key" 기술문서).
    #   영문 표식이 문서 머리/반복으로 찍힌 경우는 아래 stamps 의 CONFIDENTIAL 이 잡는다.
    #   파일명 '외부반출'·'내부교육용'은 사내 교육자료(평가셋 정답 C)를 살리려 추가.
  terms:
  - 대외비
  - 극비
  - 기밀
  # 2026-09-14 '기밀성' 제외: 정보보호 용어(기밀성·무결성·가용성)라 암호 규격서·OWASP·제안요청서에
  #   흔하다(분류함 전체 '기밀' 출현의 약 1/3). 평가셋 C 오탐 5건의 원인이었고 정답 C 문서엔 0건.
  #   정답 C 는 '기밀을 누설'·'기밀 유지'·'기밀 정보' 형태라 영향 없음.
  exclude:
  - 기밀성
  filename:
  - 대외비
  - 극비
  - 기밀
  - CONFIDENTIAL
  - 외부반출
  - 내부교육용
  base_grade: C
  weight: high
  seed_eligible: true

- id: mark_internal
  name: 내부용 표식
  terms:
  - 내부용
  - 사내한정
  - 부외비
  - Internal Only
  - Internal Use Only
  - For Internal
  filename:
  - 내부용
  - 사내한정
  - 부외비
  base_grade: S
  weight: high
  seed_eligible: false

- id: hr_payroll
  name: 인사·급여
  terms:
  - 급여대장
  - 임금대장
  - 연봉계약
  - 인사평가
  - 성과평가
  - 인사기록카드
  - 징계
  - 퇴직금
  # 2026-09-14 '4대보험' 제외: 제안서·업무 엑셀의 일반 언급으로 C 오탐. 정답 C 는 0건.
  - 원천징수
  filename:
  - 급여대장
  - 임금대장
  - 연봉계약
  - 인사기록카드
  - 퇴직금
  # term_min_count(선택): 단어별 최소 등장 횟수. 본문에서 그 횟수 미만이면 그 단어는 센 것으로
  #   치지 않는다. 적지 않은 단어는 1(종전 동작). 파일명(filename) 매칭에는 적용하지 않는다.
  # 2026-09-14 '징계' 3회 이상: 소프트웨어 관리지침 등 일반 규정 말미의 "위반 시 징계 대상이 될 수
