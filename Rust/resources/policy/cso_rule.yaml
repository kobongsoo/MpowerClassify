# ────────────────────────────────────────────────────────────────────────
# Signal E · 보안분류 스탬프 (문서에 찍힌 '작성자의 명시적 분류 의도')
#   - 키워드(L2)와의 결정적 차이: 본문 '단발 언급'("대외비가 아님")의 오탐을 막으려,
#     표식이 문서 '머리(앞 head_chars 자)'에 있거나 'repeat_min 회 이상 반복'
#     (페이지마다 찍히는 워터마크 정황)일 때만 스탬프로 인정한다.
#       · head_chars / repeat_min 은 코드 기본값(400자 / 2회)이며 환경변수로 조정 가능:
#         CSOCLASSIFY_STAMP_HEAD_CHARS, CSOCLASSIFY_STAMP_REPEAT_MIN
#   - always: true 문구는 위치/반복 게이트 없이 1건이라도 인정(거의 스탬프 전용 표현).
#   - 스탬프는 오탐이 매우 낮아 신뢰도가 높고(confidence.stamp), 전파(Signal B) seed 로도
#     쓸 수 있다(seed_eligible). 최종 등급은 다른 신호와 max 융합되어 '상향 전용' 기여.
#   ※ 표식 문구는 정책 키워드(원문 PII 아님)라 결과 근거(term)에 남겨도 안전하다.
# ────────────────────────────────────────────────────────────────────────
stamps:

- id: stamp_confidential
  name: 대외비/기밀 스탬프
  grade: C
  weight: high
  seed_eligible: true
  terms:
  - 대외비
  - 극비
  - 기밀
  - 사외비
  - CONFIDENTIAL
  # 2026-09-14 SECRET·RESTRICTED 제외: 기술문서 페이지 머리·반복에 "RESTRICTED"(SCPI 명령 등급)·
  #   "SECRET"(secret key)가 찍혀 스탬프로 오인됐다. 평가셋 정답 C 에서 이 둘로 잡힌 문서는 0건.
  # 2026-09-14 '기밀성' 제외: 암호 규격서·OWASP 에서 "기밀성"이 반복돼 '기밀' 스탬프(repeat)로 오인됐다.
  #   (stamps 의 exclude 는 같은 날 두 엔진에 추가 — 키워드·민감정보의 exclude 와 같은 동작)
  exclude:
  - 기밀성

- id: stamp_confidential_phrase
  name: 기밀 취급문구(명시)
  grade: C
  weight: high
  seed_eligible: true
  always: true          # 거의 스탬프 전용 문구 → 위치/반복 무관 1건도 인정
  terms:
  - 관계자 외 열람금지
  - 관계자외 열람금지
  - 관계자 외 열람 금지
  - 대외비-무단복제금지
  - 무단복제금지
  - 무단전재금지
  - 재배포금지
  - NOT FOR DISTRIBUTION
  - DO NOT DISTRIBUTE

- id: stamp_internal
  name: 내부용 스탬프
  grade: S
  weight: high
  seed_eligible: false
  terms:
  - 내부용
  - 사내한정
  - 부외비
  - 취급주의
  - INTERNAL ONLY
  - INTERNAL USE ONLY
  - FOR INTERNAL USE

# ────────────────────────────────────────────────────────────────────────
# Signal C · 경로 택소노미 (파일이 어디서 왔는가 / 어디에 있는가)
#   - 파일 경로(수집원 폴더·파일서버 UNC)를 등급에 매핑한다. 텍스트를 열지 않는다.
#   - match: 경로에 이 조각이 들어 있으면 매칭(부분일치, 대소문자 무시).
#       · 경로 구분자는 코드가 '/' 로 정규화하므로 패턴도 '/' 로 쓴다.
#         (윈도우 역슬래시 \, UNC \\서버\ 는 각각 /서버/, //서버/ 로 표기)
#   - 위에서부터 먼저 매칭되는 규칙 하나만 적용된다(우선순위 = 배열 순서).
#   - acl_restricted: true 면 "강한 제한" 표식 → 다른 신호가 없어도 fail-safe 로 C.
#   ※ ACL·소유자 SID·DRM 태그(윈도우 전용)는 후속 확장 지점. 지금은 경로 기반만.
# ────────────────────────────────────────────────────────────────────────

# ────────────────────────────────────────────────────────────────────────
# [2026-09-08] paths(경로) 신호를 걷어냈다.
#   실측(문서 2,266개 / 레코드 3,715건)에서 경로가 단독으로 등급을 정한 8건이
#   **전부 오탐**이었다. 경로 규칙의 조각에 슬래시 없는 말이 섞여 있어서
#   "보안파일서버"라는 제품의 설치확인서가 보안 서버의 파일로 취급됐고,
#   공개 평가 데이터셋이 폴더 이름(finance·public) 때문에 걸렸다.
#   문서가 어디 놓여 있는지는 담당자가 옮기면 바뀐다 — 위치로 기밀을 정하면
#   폴더 정리 한 번에 등급이 흔들린다.
#   경로로 등급을 주던 자리는 실행할 때 --failsafe 로 대신한다.
#   설계: plan/보안등급-신호정리-paths제거-20260908.html
#
# [2026-09-08] 파일명에서 찾을 말은 filename 으로 따로 적는다.
#   예전에는 terms(본문용)를 파일명에도 그대로 썼다. 그 탓에 파일명 신호 99건 중
#   79건이 제품명 규칙 하나에서 나왔다 — 제품 매뉴얼이 이름 때문에 C 가 됐다.
#   filename 을 안 적은 규칙은 파일명 신호를 만들지 않는다(terms 로 폴백하지 않는다).
# ────────────────────────────────────────────────────────────────────────
