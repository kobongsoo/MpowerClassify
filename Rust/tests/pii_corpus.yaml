  - name: rrn_전부0은법인번호로
    text: "주민등록번호 000000-0000000 (빈칸)"
    note: "000000-0000000 은 주민번호로는 걸러지지만 법인등록번호 모양에 걸린다(ko-pii 실동작)."

  # ── RRN 이어붙음 — 표를 텍스트로 뽑을 때 칸 사이 구분자가 사라진 모양 ──
  # [출처] 2026-09-02 D:\분류함 실측(문서 986개)에서 Rust 가 놓친 RRN 7건이 전부 이 모양이었다.
  #   "951026-1411232" 와 "821016-2760084" 가 구분자 없이 붙으면
  #   "951026-1411232821016-2760084" 가 되는데, 여기서
  #     · 앞 번호는 뒤에 숫자가 이어져 (?!\d) 에 걸려 탈락
  #     · 뒤 번호는 앞에 숫자가 있어 (?<!\d) 에 걸려 탈락
  #     · 대신 겹친 자리의 13자리(앞7+뒤6)가 '구분자 없는 주민번호'로 성립
  #   즉 ko-pii 가 내는 답은 원래 두 사람의 번호가 아니라 경계에서 생긴 제3의 값이다.
  #   그 값이 옳으냐와 별개로, Rust 는 그마저 하나도 못 잡았다 —
  #   det_rrn 이 find_bounded 가 아니라 captures_iter 를 써서, 앞 번호를 매치로 만든 뒤
  #   경계 검사로 버리는 사이 반복자가 그 매치 끝까지 지나가 버리기 때문이다(부록 E-①과 같은 갈래).
  #   아래 값은 모두 체크섬만 맞춘 가짜다(실문서 값이 아니다).
  - name: rrn_이어붙음_겹침13자리
    text: "951026-1411232821016-2760084"
  - name: rrn_이어붙음_겹침13자리2
