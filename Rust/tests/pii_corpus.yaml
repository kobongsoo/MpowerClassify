      1 | 홍길동 | 010-1234-5678 | 690-61-68110
      2 | 김철수 | 02-987-6543 | 492-51-21400
      3 |      |            | 000-00-00000
    note: "표에서 빈칸을 0 으로 채운 행 — 실제 문서에서 오탐이 쏟아지던 모양."
  - name: mix_인접PII
    text: "010-1234-5678/hong@example.co.kr/192.168.10.25"
    note: "구분자 없이 PII 가 붙어 있는 줄 — span 경계가 서로 침범하기 쉬운 자리."

  # ── 호모글리프 회피 — 숫자를 닮은 글자로 가려 적은 문서 ──
  - name: hg_주민_O와l로가림
    text: "주민등록번호 95lOO6-1068003 입니다."
  - name: hg_전화_O로가림
    text: "연락처 O1O-1234-5678 입니다."
  - name: hg_사업자_S로가림
    text: "사업자등록번호 69O-61-681lO 입니다."
  - name: hg_neg_영단어
    text: "Seoul Office 는 SOB 동에 있다."
    note: "ko-pii 는 '숫자 2개 이상 + 흉내 글자 1개 이상' 인 토막만 되돌린다. 멀쩡한 낱말은 안 건드린다."
  - name: hg_neg_숫자1개
    text: "코드 IS0 로 표기한다."
  - name: hg_neg_횝내없음
    text: "숫자 12345 만 있는 줄."
  - name: hg_여권_S접두
    text: "여권번호 S87654321 소지."

  # ── 정규화: 전각·제로폭 — 값 좌표계가 달라 값 비교는 건너뛴다 ──
  - name: norm_전각숫자
    text: "연락처 ０１０-１２３４-５６７８ 입니다."
  - name: norm_제로폭
    text: "주민등록번호 951006-10\u200B68003 입니다."

  # ── 유니코드 구분자·전각 — ko-pii 정규화가 어디까지 펴는가 ──
  - name: uni_전화_endash
    text: "연락처 010–1234–5678 입니다."
    note: 워드가 자동으로 바꾸는 en dash. ko-pii 는 '-' 로 펴서 검출한다.
  - name: uni_전화_가운뎃점
    text: "연락처 010·1234·5678 입니다."
    note: 한국 문서에서 흔한 가운뎃점 구분자. 역시 '-' 로 펴진다.
  - name: uni_계좌_슬래시류
    text: "계좌번호 110∕234∕567890 국민은행"
    note: 유니코드 나눗셈 슬래시(U+2215) 는 '/' 로 펴진다.
  - name: uni_neg_전각O
    text: "연락처 Ｏ1Ｏ-1234-5678 입니다."
    note: 전각 O 는 흉내 폴딩이 NFKC 보다 먼저라 'O' 로 남아 검출되지 않는다. 순서를 뒤집으면 우리만 잡는 오탐이 된다.
  - name: uni_neg_아래아점
    text: "계좌 110ㆍ234ㆍ567890 국민은행"
    note: ㆍ(U+318D) 는 대시가 아니라 NFKC 로 ᆞ(U+119E) 가 되어 구분자 구실을 못 한다.

  # ── 유니코드 정규화 — ko-pii 가 글자를 '펴서' 막는 회피들 ──
  # 표는 scripts/gen_pii_fold.py 가 ko-pii 에 물어 만든다(Rust/src/pii_fold.rs).
  - name: norm_결합표시_주민
    text: "주민등록번호 951́006-1068003 입니다."
    note: 숫자 사이에 덧쓰기 표시를 끼워 정규식을 피하려는 시도. 표시를 지워 검출한다.
  - name: norm_소프트하이픈_전화
    text: "연락처 010-12­34-5678 입니다."
    note: 소프트하이픈(U+00AD)은 안 보이는 문자라 지워진다.
  - name: norm_NBSP_전화
    text: "연락처 010 1234 5678 입니다."
    note: 줄바꿈없는공백(U+00A0)은 보통 공백으로 펴진다.
  - name: norm_아랍숫자_주민
    text: "주민등록번호 ٩٥١٠٠٦-1068003 입니다."
    note: 아랍-인도 숫자를 ASCII 숫자로 편다. NFKC 는 이걸 안 바꾸므로 별도 표가 필요하다.
  - name: norm_수학볼드_사업자
    text: "사업자등록번호 𝟐𝟗𝟐-61-68110 입니다."
    note: 수학 볼드 숫자(보충면 U+1D7D0~)도 ASCII 로 편다.
  - name: norm_전각영문_이메일
    text: "메일 ｈｏｎｇ@example.co.kr 로 회신."
    note: 전각 영문은 NFKC 가 ASCII 로 편다.
  - name: norm_neg_조합자모_주민
    text: "주민등록번호 9001ᄀ 01-1068003"
    note: 조합용 한글 자모를 지우면 숫자열이 '9001 01' 로 갈라져 검출되지 않는다.
  - name: norm_neg_원문자_전화
    text: "연락처 ①①①-1234-5678 입니다."
    note: 원문자 ① 은 1 로 펴지지만 앞자리가 111 이 되어 전화번호 규칙에 안 맞는다.

  # ── EMAIL 경계 — ko-pii email.py 원본과 어긋나기 쉬운 자리 ──
  # 원본은 (1) 앞뒤 경계 look-around (2) 도메인 라벨이 영숫자로 시작·끝
  # (3) 로컬부 앞뒤 점·연속 점 거부 를 모두 건다. 하나라도 빠지면 어긋난다.
  - name: email_숫자TLD
    text: "메일 hong@example.co1 로 회신."
    note: 원본은 TLD 에 숫자를 허용한다([A-Za-z0-9] 라벨). 글자만 받으면 미탐.
  - name: email_TLD뒤_숫자
    text: "메일 hong@example.com1 로 회신."
    note: 원본은 com1 까지 한 라벨로 먹는다. 글자만 받으면 값이 짧게 잘린다.
  - name: email_한글자TLD
    text: "메일 hong@example.a 로 회신."
    note: 원본 도메인 라벨은 한 글자도 된다. {2,} 로 막으면 미탐.
  - name: email_neg_도메인_연속점
    text: "메일 hong@example..com 로 회신."
    note: 원본은 도메인에 연속 점이 있으면 버린다.
  - name: email_neg_로컬_앞점
    text: "메일 .hong@example.com 로 회신."
    note: 원본은 로컬부가 점으로 시작하면 버린다.
  - name: email_neg_로컬_뒷점
    text: "메일 hong.@example.com 로 회신."
    note: 원본은 로컬부가 점으로 끝나면 버린다.
  - name: email_neg_로컬_연속점
    text: "메일 ho..ng@example.com 로 회신."
    note: 원본은 로컬부에 연속 점이 있으면 버린다.
  - name: email_도메인_하이픈
    text: "메일 hong@my-corp.example.com 로 회신."
    note: 라벨 가운데 하이픈은 정상이다.
  - name: email_neg_도메인_끝하이픈
    text: "메일 hong@example-.com 로 회신."
    note: 원본 라벨은 영숫자로 끝나야 한다.
  - name: email_neg_도메인_앞하이픈
    text: "메일 hong@-example.com 로 회신."
    note: 원본 라벨은 영숫자로 시작해야 한다.

  # ── URL 경계 — ko-pii url.py 원본과 어긋나기 쉬운 자리 ──
  # 원본은 (1) 대소문자 무시 (2) ` ) ] } 를 URL 에서 제외 (3) 끝의 .,;:!? 를 떼어낸다.
  - name: url_문장끝_마침표
    text: "자료는 https://example.co.kr/doc 참고. 끝."
    note: 문장 끝 마침표는 URL 이 아니다. 원본은 끝의 .,;:!? 를 떼어낸다.
  - name: url_괄호안
    text: "자료(https://example.co.kr/doc)를 보라."
    note: 닫는 괄호는 URL 에 안 들어간다.
  - name: url_대괄호안
    text: "참고 [https://example.co.kr/a] 링크."
    note: 닫는 대괄호도 제외 대상이다.
  - name: url_대문자스킴
    text: "자료는 HTTPS://EXAMPLE.CO.KR/DOC 참고."
    note: 원본은 대소문자를 무시한다. 소문자만 받으면 미탐.
  - name: url_쉼표뒤
    text: "링크 https://example.co.kr/a, https://example.co.kr/b 둘."
    note: 쉼표도 끝에서 떼어낸다. 두 건이 각각 잡혀야 한다.
  - name: url_백틱
    text: "코드에 `https://example.co.kr/x` 를 넣어라."
    note: 백틱은 URL 에서 제외된다(마크다운 코드 표기).

  # ── 차등 퍼징으로 찾은 갈라짐(2026-09-02) ──
  # 무작위 변이 2,386건을 양쪽에 먹여 나온 6건. 원인이 서로 달라 전부 남긴다.
  - name: fz_url_앞에한글
    text: "자료는 서https://example.co.kr/doc 참고."
    note: 원본 정규식의 \b(낱말 경계) 때문에 앞 글자에 붙은 URL 은 안 잡는다.
  - name: fz_url_앞에숫자
    text: "자료는 5https://example.co.kr/doc 참고."
    note: 위와 같은 이유. \b 가 빠지면 우리만 잡는 오탐이 된다.
  - name: fz_phone_플러스앞숫자
    text: "연락처 2+82-10-123-5678 입니다."
    note: 원본은 +에서 매치가 안 만들어져 다음 자리부터 다시 찾아 82-10-… 을 잡는다.
          경계 실패 시 통째로 버리면 전화번호를 통째로 놓친다.
  - name: fz_addr_숫자뒤한글
    text: "주소는 서울특별시 강남구 7삼동 역3 입니다."
    note: 원본은 (?![가-힣]) 실패 시 되돌아가 "강남구 7"→"강남구" 로 줄인다.
  - name: fz_addr_동뒤한글
    text: "주소는 서울 별 강남구 역삼동특737 입니다."
    note: 위와 같은 되돌아가기. 밖에서 검사해 버리면 값이 달라진다.
  - name: fz_addr_번지부분되돌림
    text: "주소는 서 울특별시 강남구 56헤란로 1테2 입니다."
    note: 숫자 그룹 '안에서도' 되돌아간다 — "강남구 56" 실패 → "강남구 5" 로 줄여 성립.

  # ── 주소 상세 확장(_extend_with_detail) — 동·호·층·건물명·괄호상세 ──
  # ko-pii 는 주소 뒤에 붙는 상세를 span 에 포함시킨다. 이게 빠지면 값이 짧게 잘린다.
  - name: addr_상세_동호
    text: "주소는 서울특별시 강남구 테헤란로 152 103동 1202호 입니다."
    note: 동·호까지 주소 범위에 들어간다.
  - name: addr_상세_층
    text: "주소는 서울특별시 강남구 테헤란로 152 5층 입니다."
    note: 층수도 포함된다.
  - name: addr_상세_건물명
    text: "주소는 서울특별시 강남구 테헤란로 152 강남파이낸스센터 입니다."
    note: 건물 접미사(센터·빌딩·타워…)로 끝나는 토큰은 상세로 붙는다.
  - name: addr_상세_괄호
    text: "주소는 서울특별시 강남구 역삼동 737 (신정동,롯데캐슬아파트) 입니다."
    note: 괄호 안 상세도 포함된다.
  - name: addr_상세_건물명_층
    text: "주소는 경기도 성남시 분당구 판교로 235 판교자이 12층 입니다."
    note: 건물명 + 층이 이어지면 둘 다 포함된다.

  # ── 3만 건 퍼징으로 찾은 갈라짐(2026-09-02) ──
  - name: fz3_인접거리_글자단위
    text: "본적 서울특별시 종로구 세종대로 175-1 | 이사 간 제주시 첨단로 24 | 살던 곳이 성남시 분당구 입니다."
    note: ko-pii 의 인접 억제 거리(30·50)는 '글자' 단위다. 바이트로 재면 한글에서
          창이 1/3 로 좁아져 같은 주소의 다른 조각을 또 잡는다.
  - name: fz3_계좌_글자섞임
    text: "카카오뱅크 3-3허01-123c56X7 송금"
    note: 원본은 공백·하이픈만 걷어낸 뒤 '나머지가 전부 숫자' 여야 계좌로 본다.
          숫자만 골라 세면 글자 섞인 토막까지 계좌가 되어 다른 PII 를 밀어낸다.
  - name: fz3_검출기순서_건강보험
    text: "의료보험 12345678901
카카오뱅크 로 송금"
    note: 건강보험(HIGH 0.9)과 계좌(HIGH 0.9)가 겹치면 '먼저 돈 검출기' 가 이긴다.
          ko-pii 차례(건강보험 → 계좌)를 안 지키면 건강보험을 통째로 잃는다.
  - name: fz3_아랍숫자_IP
    text: "접속 IP 19٠2.168.10.5 기록."
    note: IP 는 원본이 [0-9](ASCII 만)를 쓴다. 유니코드 \d 를 쓰면 아랍숫자까지 물어
          엉뚱한 매치가 되고 진짜 IP 를 놓친다.

  # ── IPv6 — Rust 미포팅 여부 확인 ──
  - name: ip6_전체표기
    text: "접속 IP 2001:0db8:85a3:0000:0000:8a2e:0370:7334 기록."
    note: ko-pii ip.py 는 IPv6 도 IP 라벨로 잡는다.
  - name: ip6_축약
    text: "서버 fe80::1 확인."
    note: "콜론 두 개(::) 축약 표기."
  - name: ip6_혼합축약
    text: "IPv6 2001:db8::8a2e:370:7334 접속."
    note: "축약과 그룹이 섞인 표기."

  # ── CORP_REG ISBN 예외 (ko-pii corp_reg.py) ──
  - name: corp_neg_ISBN13
    text: "도서 ISBN 9789587081780 입고"
    note: 978/979 로 시작하는 '무구분 13자리' 는 도서 바코드(GS1 Bookland)라 법인번호가 아니다.
  - name: corp_neg_ISBN979
    text: "바코드 9794914072500 확인"
    note: 979 도 같은 이유로 거부한다.
  - name: corp_ISBN접두_하이픈은검출
    text: "법인등록번호 978958-7081780 등기"
    note: 같은 앞자리라도 구분자가 있으면 바코드가 아니므로 법인번호로 잡는다.

  # ── 퍼징 잔여 2건(2026-09-02) ──
  - name: fz3_처방_자모_클러스터
    text: "처방전 번호 RX-­ᄀ124567 발급."
    note: 안 보이는 문자로 덩어리가 끊기면 그 뒤 자모는 스스로 기준 글자가 되어 살아남는다.
          무조건 지우면 RX-124567 이 되어 우리만 처방전으로 잡는다.
  - name: fz3_이메일_비ASCII도메인
    text: "메일 il.dong@５mail.ćorp.example.net"
    note: 도메인 라벨에 비ASCII(ć)가 있으면 원본은 이메일로 보지 않는다.
