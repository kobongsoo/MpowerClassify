# PII 정답표 코퍼스 — Rust 포팅 검증에 쓰는 '검사 문장' 목록
#
# 이 파일이 검사 대상이고, 정답은 여기 없다. scripts/gen_pii_golden.py 가 이 문장들을
# 진짜 ko-pii 에 넣어 나온 결과를 Rust/tests/pii_golden.json 에 적는다.
# 즉 문장은 사람이 고르고, 정답은 ko-pii 가 정한다.
#
#   python scripts/gen_pii_golden.py            # 이 파일을 읽어 정답표를 다시 만든다
#   python scripts/gen_pii_golden.py --check    # 정답표가 최신인지 확인만 한다
#
# 사례를 넣을 때:
#   · name  = 실패 메시지에 그대로 찍히는 이름. 잡혀야 하면 <라벨>_, 안 잡혀야 하면
#             <라벨>_neg_, 여러 라벨이 섞이면 mix_ 로 시작하면 읽기 좋다.
#   · text  = 검사할 문장. 여러 줄이면 아래 mix_ 사례처럼 '|' 블록으로 적는다.
#   · note  = (선택) 왜 이 사례가 있는지. 다음 사람이 버그로 오해하지 않게 남긴다.
#
# 넣지 말 것: 실제 개인정보. 이 파일의 문장은 그대로 정답표에 실려 git 에 남는다.
# 여기 번호들은 무작위로 만든 뒤 체크섬이 맞는 것만 고른 가짜값이다.
#
# 촘촘함의 기준은 '라벨당 몇 개'가 아니라 '갈래마다 최소 하나'다 — EMAIL 은 정규식이
# 하나뿐이라 10개를 넣어도 같은 길을 열 번 밟지만, PHONE 은 갈래가 7개다.

