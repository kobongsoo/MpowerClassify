# ------------------------------------------------------------------
# 업무분류 판단 기준(doc_rule.yaml)의 '머리 부분' 본보기
#  · 쓰는 곳: --build-doc-rule 이 doc_rule.yaml 을 만들 때 conflict·defaults·
#    signals·embed 를 여기서 가져온다. 회사 조정(doc_rule.local.yaml 의 settings)에
#    적은 칸만 이 값을 덮는다.
#  · doctype_rules(분류별 규칙)는 여기에 적지 않는다 — 그건 회사 분류 체계에서
#    자동으로 만들어진다. 이 파일은 '규칙을 어떻게 점수 매길지'만 정한다.
#
#  [왜 따로 두나] doc_rule.yaml 은 만들 때마다 통째로 다시 쓰여 주석이 남지
#  않는다. 값의 뜻과 그 값을 고른 이유는 이 파일에 적어 두고, doc_rule.yaml 에는
#  값만 들어가게 한다.
#
# **계산법 : 예) title(0.65) + name(0.30) → 1 - 0.35×0.70 = 0.755
# 성질: 항상 [0,1) 안에 머물고, 근거가 늘수록 오르되 포화한다.
# 계산한 점수가 t_low(0.35) 이상이면 그 분류를 붙인다(후보 문턱 — 아래 defaults).
#
# [4가지 신호원 — 무엇을 어디서 보는가]
#   아래 설명의 예시로 쓸 규칙 하나(weight: medium 이라 가운데 칸이 쓰인다):
#     node: DC_계약서
#     title_terms: [계약서]        head_terms: [계약기간]   terms: [갑, 을]
#     filename: [계약]
#
#   title (0.65) — 문서의 '첫 비어있지 않은 줄'에 title_terms 가 있나.
#       예) 첫 줄이 "용역 계약서" → 걸림. 사람이 문서 맨 위에 일부러 적어 둔
#           이름이라 판별력이 가장 세다. "출 장 여 비 규 정" 처럼 자간을 벌려
#           놓아도 잡는다(_despace).
#       ※ .ppt/.xls/.xlsx 는 첫 줄이 제목이 아니어서 이 신호를 건너뛴다.
#
#   head (0.55) — 앞 head_chars(기본 400)자 안에 head_terms 가 있나.
#       예) 제목 줄에는 없어도 "… 계약기간: 2026-01-01 …" 이 문서 앞머리에
#           나오면 걸림. 제목 다음으로 문서 성격이 잘 드러나는 구간이다.
#
#   name (0.30) — 폴더를 뺀 '파일 이름'에 filename 조각이 있나.
#       예) "2026_계약_최종.hwp" → 걸림. 짧고 일부러 붙인 이름이라 우연 일치는
#           드물다. 다만 이 신호 하나만으로는 t_low(0.35)를 못 넘어 후보가 되지
#           못한다 — 파일 이름만 보고 붙인 라벨은 오탐이 잦기 때문이다.
#
#   body (0.15) — 문서 '전체'에서 terms 를 센다(min_distinct·min_count 를 넘겼을 때만).
#       예) 본문 어딘가에 '갑'·'을'이 나옴. 어느 문서에나 나올 수 있는 말이라
#           가장 약하고, 단독으로는 후보를 만들지 못한다(_WEAK_ONLY).
#
# [name 의 세 칸이 같은 값인 이유]
#   표가 우연히 같은 게 아니라, 코드가 name 만 weight 를 보지 않고 "medium"
#   칸을 직접 집어 쓴다. 파일명은 '이름에 그 말이 있다'는 사실 하나뿐이라
#   규칙의 자신감으로 등급을 나눌 근거가 없다.
#
# [2026-09-07] form·path·structure 세 신호는 어느 규칙도 그 필드를 채우지
#   않아 한 번도 돌지 않았고, 읽는 사람이 매번 '이건 도는 건가'를 되짚어야
#   해서 코드에서 걷어냈다. 옛 규칙에 그 필드가 남아 있으면 검증이 알려 준다.
# ------------------------------------------------------------------
version: doctype-2026.08.ui.4
# 이 회사에 얹을 업종 사전 — doc_synonyms.<업종>.yaml 을 고른다.
# 앞에 적은 업종이 더 세다(같은 분류 이름이 두 사전에 있으면 앞엣것 말이 먼저 온다).
# 좁은 업종을 앞에, 넓은 업종을 뒤에 두었다 — public(행정 문서)은 어느 조직에나
# 있어서 가장 넓으므로 맨 뒤다.
industry: [medical, legal, finance, construction, manufacturing, education, public]
# conflict — 한 문서가 업무분류 여러 칸에 동시에 걸렸을 때 라벨을 몇 개까지 붙일지.
#   예) 「OO사 유지보수 용역계약서 및 제안서.hwp」 가 후보 문턱(t_low)을 넘은 칸:
#         계약서 0.91 · 제안서 0.72 · 유지보수 문서 0.41
#
#   all — 걸린 칸을 모두 붙인다 → 계약서·제안서·유지보수 문서
#         conflict: all
#
#   top_n — 점수가 높은 n 개만 붙인다. 잘린 수는 결과에 truncated 로 남는다.
#         conflict: {strategy: top_n, n: 2}   → 계약서·제안서 (truncated: 1)  (기본값)
#       · strategy = 전략 이름(all 또는 top_n). all 도 {strategy: all} 로 쓸 수 있다.
#       · n        = 남길 라벨 수(1 이상 정수). top_n 에는 반드시 적는다.
#
#   · 어느 전략이든 먼저 '조상 흡수'를 한다 — 같은 가지의 상위·하위(예: 계약 ⊃
#     용역계약서)가 함께 걸리면 하위만 남긴다. 상위 경로는 하위 라벨에 이미 들어 있다.
#   · max 는 쓸 수 없다 — 보안 등급(S>A>B>C)과 달리 업무분류 칸끼리는 서열이 없다.
#   · 이 줄을 지우면 --build-doc-rule 이 all 을 채운다(코드 기본값). 회사만 바꾸려면
#     doc_rule.local.yaml 의 settings: conflict: 에, 한 번만 바꾸려면 실행 때
#     --conflict doctype=top_n:2 처럼 옵션으로 준다.
#
# [2026-09-28 기본값을 top_n 2 로] 예전에는 all 이었다. 걸린 칸을 다 붙이면
#   한 문서에 서너 개가 달리는 일이 잦고, 검토 화면에서 사람이 그만큼 더
#   지워야 한다. 문서 하나의 성격을 말하는 라벨은 보통 하나이고, 많아야 둘이다
#   (「용역계약서 및 제안서」처럼 실제로 둘인 문서가 있어 1 이 아니라 2 로 둔다).
#   잘린 것은 사라지지 않고 결과에 truncated 수로 남으므로, 나중에 "몇 개가
#   잘렸나"를 세어 이 값이 적절한지 다시 볼 수 있다.
conflict: {strategy: top_n, n: 2}
defaults:
  # [2026-09-22] scoring(legacy/staged 스위치)는 없앴다 — 채점은 위 noisy-OR 하나뿐이다.
  head_chars: 400
  # 본문(body) 신호를 인정할 최소 조건 — "서로 다른 말 몇 종류가(min_distinct),
  # 모두 몇 회(min_count) 나와야 본문에서 걸린 것으로 볼지".
  #
  # [왜 1/1 인가 — 실측] d:\sample 18건으로 1/1 · 1/2 · 2/1 · 2/2 를 모두 돌려
  # 봤다(2026-08-26). 네 경우 모두 **붙는 라벨이 완전히 같았다**(라벨 23개 /
  # 문서 17건). 달라진 것은 신뢰도 소수점뿐이다(예: 0.91 → 0.89).
  # 까닭은 staged 모드의 구조에 있다 — 본문은 단독으로 후보를 만들지 못하고
  # (재설계 8-4) 신뢰도도 0.15 로 낮아, 라벨을 정하는 것은 제목·파일명이다.
  # 본문 문턱을 올려도 막을 오탐이 없으므로, 값만 복잡해지는 2 대신 1 로 둔다.
  #
  # [언제 올리나] '규정'·'보고'처럼 어느 문서에나 나오는 말을 규칙에 넣었다면
  # 그 규칙에만 min_count: 2 를 직접 적는 편이 낫다(규칙 한 줄에 같은 키를 쓰면
  # 그 분류에만 적용된다). 전체 기본값을 올리면 멀쩡한 근거까지 함께 깎인다.
  # 코퍼스가 수백 건으로 늘면 같은 실험을 다시 해 볼 것.
  min_distinct: 1
  min_count: 1
  # ── 후보 채택 문턱 ────────────────────────────────────────────────
  # t_low: 근거들을 noisy-OR 로 합친 최종 점수가 이 값 미만이면 후보에서 뺀다.
  #   지금 실제로 후보를 가르는 유일한 문턱이다(doctype.rs·doctype.py).
  #   0.30 → 0.35 로 올린 이유: 0.30 은 '파일 이름' 하나만 걸린 후보(기여 0.30)가
  #   딱 문턱값이라 그대로 살아남는 자리다. 파일 이름만으로 붙은 라벨은 오탐이
  #   잦아 사람 손이 더 간다. 0.35 로 두면 그런 후보는 떨어지고, 파일 이름에
  #   제목·앞부분 중 하나라도 겹치는 후보만 남는다.
  t_low: 0.35
  # [2026-09-22] t_high('확정 후보'선)는 판정에 쓰이지 않아 없앴다. 순서 검증(T20)은
  #   이제 t_low ≤ t_seed 만 본다.
  # t_seed: 자동 씨앗 선별에서 "이 정도 확신이면 기준 문서 후보로 삼는다"는 선.
  #   기준 문서는 다음 분류의 잣대가 되므로 후보 채택선(t_low)보다 훨씬 높다 —
  #   여기서 헐거우면 잘못 붙은 라벨이 씨앗이 되어 오류가 스스로 번식한다.
  t_seed: 0.85
  # embed_cap: 규칙에 걸린 말은 없고 '비슷한 문서'(벡터)만 보고 붙은 후보의
  #   신뢰도 상한. 벡터는 "무엇이 닮았는지"를 사람에게 설명하지 못하므로,
  #   아무리 닮아도 규칙 근거가 있는 후보보다 확신이 높아지지 않게 눌러 둔다.
  embed_cap: 0.65
# [신호별 신뢰도] 위 설명의 괄호 안 숫자를 여기서 바꿀 수 있다.
#  · 적은 칸만 덮어쓰고 나머지는 프로그램 기본값을 쓴다 — title 만 올려 보려면
#    title 한 줄만 남기면 된다.
#  · 값은 0.0~1.0. 모르는 신호 이름(오타)이나 범위 밖 값은 검증에서 막는다
#    (--check-rules · 화면 저장). 조용히 무시하지 않는다.
#  · name 은 규칙의 weight 를 보지 않고 medium 값만 쓴다 — 세 칸을 반드시
#    같은 값으로 적어야 한다(다르면 검증에서 막는다).
#  · 값을 바꾸면 판정이 바뀐다. 자동 생성 규칙의 판(version)은 내용 지문이라
#    저절로 바뀌어, 나중에 결과만 보고도 "어느 기준으로 매긴 값인지" 되짚을 수 있다.
#  · 신호는 이 넷이 전부다. form·path·structure 는 규칙이 그 필드를 한 번도
#    안 채워 실제로 돌지 않았고, 2026-09-07 에 코드에서 걷어냈다.
signals:
  title: {high: 0.80, medium: 0.65, low: 0.50}
  head:  {high: 0.70, medium: 0.55, low: 0.40}
  body:  {high: 0.25, medium: 0.15, low: 0.10}
  name:  {high: 0.30, medium: 0.30, low: 0.30}

# ── 분류체계 제목을 핵어로 쓰기(설계서 7장 · 13장 D1) ──────────────
# 파일 이름의 '끝자리'가 어떤 분류의 제목이면 그 분류의 약한 후보로 삼는다.
# 핵어 목록은 여기 적지 않는다 — --build-doc-rule 이 분류 제목과 사전으로 분류마다
# 만들어 규칙의 heads 칸에 적으므로, 고객이 제목을 바꾸면 다시 만들 때 따라간다.
# 넓은 제목·묶음 제목·주제형 제목·흔한 끝말은 엔진이 자동으로 거른다(ⓐ).
# 그래도 남는 예외만 아래 두 가지로 끈다. 적는 곳은 이 파일이 아니라 회사 조정
# 파일(doc_rule.local.yaml)의 head 칸이다 — 화면 '파일 이름 끝자리로 찾기' 표가 적는다.
#
# ⓑ 말 단위 제외 — 대부분의 수동 제외는 이것. 노드 id 를 적지 않는다.
#   문제는 '말'에 있지 노드에 있지 않아서다. 제목이 다른 말로 바뀌면
#   목록에 없는 말이라 아무도 손대지 않아도 다시 쓰인다.
# head:
#   title_exclude:
#     - 행사자료        # 앞말이 주제라 행사 계획서·결과보고서까지 끌려온다
#
# ⓒ 노드 단위 끄기 — 드물게. 말은 괜찮은데 그 노드에서만 끄고 싶을 때.
#   끌 당시 제목을 함께 적는다. 제목이 달라지면 이 끄기는 무효가 되고
#   로드할 때 "재검토" 경고가 뜬다 — 조용히 꺼진 채로 남지 않게 하려는 것이다.
# head:
#   node_off:
#     - node: DC_xxx
#       title_at_decision: 행사서류

new_rule:
  # --build-doc-rule 이 분류마다 규칙을 만들 때 얹는 기본 weight(회사 조정의 weight 가 이긴다).
  # weight 는 그 규칙의 '모든 신호'가 쓸 신뢰도 열을 고른다.
  #   high   : 제목 0.80 · 앞부분 0.70 · 본문 0.25 …  (확실한 분류에)
  #   medium : 제목 0.65 · 앞부분 0.55 · 본문 0.15 …  (기본)
  #   low    : 제목 0.50 · 앞부분 0.40 · 본문 0.10 …  (넓고 흔한 분류에)
  # 엔진 기본값도 medium 이지만, 파일에 적어 두면 관리자가 "이 값을 올릴 수도
  # 있다"는 것을 알게 된다 — 안 보이는 기본값은 아무도 조정하지 않는다.
  #
  # => 계산법 : 예) title(0.65) + name(0.30) → 1 - 0.35×0.70 = 0.755
  # 성질: 항상 [0,1) 안에 머물고, 근거가 늘수록 오르되 포화한다.
  weight: medium

embed:
  # 업무분류 2단계 — seed 벡터 비교(재설계 9장). 파일명·제목에 단서가 없는
  # 문서는 규칙으로 원리적으로 못 잡는다. 그 몫을 이 단계가 맡는다.
  enabled: true
  # 아래 값은 검증셋 150건 실측으로 고른 것이다(2026-08-26).
  #   k=5        씨앗이 33건뿐이라 투표인단을 10 으로 잡으면 seed 의 30% 가
  #              투표하게 되어, 이웃이 아닌 문서까지 표를 던진다.
  #   min_sim    0.55 → 0.70. 이 한 값이 정밀도를 가장 크게 좌우했다.
  #              0.55 에서는 안 닮은 이웃까지 믿어 오라벨이 4 → 8 로 늘었다.
  #   min_share  0.40. 득표율 문턱.
  # 씨앗이 수백 건으로 늘면 k 를 다시 올리고 재측정할 것(설계서 16장).
  k: 5
  dup_threshold: 0.95
  min_sim: 0.70
  min_share: 0.40

bm25:
  # 업무분류 2단계 — 제목 · 파일명 말 비교(설계서 업무분류-2차-BM25 §16).
  # 벡터 비교와 나란히, 지금 문서의 제목(첫 줄) · 파일명을 '분류별로 묶은 기준 문서'와
  # 견준다. 기준 문서에 실제로 쓰인 말(사내 양식명 · 프로젝트명)로 1차가 놓친 문서를 건진다.
  # 평가셋 실측(2026-10-22): 사람 판정 F1 62.0 → 67.3%, 정밀도도 71.3 → 73.8%.
  enabled: true
  # 토큰: 단어 안에서 글자 두 개씩 겹쳐 자른다(+ 단어 통째). 지금은 bigram 만.
  tokenizer: bigram
  # 필드 무게 — 두 값의 비율만 의미가 있다. 앞 400자는 넣지 않는다(넣으면 F1 이 낮았다).
  # 파일명은 끝 잡음 말 · 괄호 안 · 숫자가 섞인 말을 뺀 뒤 비교한다.
  fields: {title: 1.0, name: 1.0}
  threshold:
    # auto — 최소 점수를 실행마다 기준 문서로 계산한다(기준 문서끼리 자기 제외 모의시험).
    #        "문턱을 넘은 답 중 target_precision 이상 맞힌 가장 낮은 점수"가 문턱이다.
    #        통과가 min_pass 건 미만이면 문턱을 못 정한 것 — 그 실행은 BM25 를 건너뛴다.
    # fixed — 아래 min_score 를 쓴다(시험용).
    mode: auto
    target_precision: 0.95
    min_pass: 10
    min_margin: 0.0
  # 점수가 제목에서는 0 이고 파일명에서만 나온 후보 — 내되 확신을 낮추고 '파일명에서만 겹침'으로
  # 표시해 늘 확인 필요로 보낸다.
  name_only: {allow: true, cap: 0.55}
